<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Storage Inspector smoke tests</title>
<style>body{font:16px system-ui;max-width:800px;margin:32px auto;padding:0 16px;background:#101827;color:#eef}li{padding:6px}.pass{color:#79e0b5}.fail{color:#ff8793}iframe{width:100%;height:560px;border:1px solid #445;border-radius:12px;margin-top:16px}</style></head>
<body><h1>Storage Inspector — browser smoke tests</h1><p>Runs against the app in a same-origin frame. Uses temporary test keys and cleans them up afterward.</p><p id="summary" role="status">Waiting for app frame…</p><ol id="results"></ol><iframe id="app" src="index.html" title="Storage Inspector test instance"></iframe>
<script>
(async()=>{
 const out=document.querySelector('#results'),frame=document.querySelector('#app'),results=[];
 const test=(name,ok,detail='')=>{results.push(!!ok);const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+name+(detail?' ('+detail+')':'');out.append(li)};
 await new Promise((resolve,reject)=>{frame.addEventListener('load',resolve,{once:true});frame.addEventListener('error',reject,{once:true})});
 const w=frame.contentWindow,d=frame.contentDocument,s=w.localStorage;
 const keys=['__si_test_a','__si_test_b','__si_imported','__si_added'];const clean=()=>{keys.forEach(k=>s.removeItem(k));w.sessionStorage.removeItem('__si_session')};
 try{
 clean();s.setItem(keys[0],'needle value');s.setItem(keys[1],'other');
 d.querySelector('#search').value='needle';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));
 test('search filters matching key/value',d.querySelectorAll('.entry').length===1&&d.querySelector('.key').textContent===keys[0]);
 d.querySelector('#search').value='';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));
 d.querySelector('button[aria-label="Edit '+keys[0]+'"]').click();d.querySelector('#value').value='updated';d.querySelector('#editor').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
 test('edit updates storage',s.getItem(keys[0])==='updated');
 d.querySelector('button[aria-label="Delete '+keys[1]+'"]').click();test('delete removes key',s.getItem(keys[1])===null);
 const file=new w.File([JSON.stringify({[keys[2]]:{enabled:true}})],'fixture.json',{type:'application/json'}),transfer=new w.DataTransfer();transfer.items.add(file);d.querySelector('#file').files=transfer.files;d.querySelector('#file').dispatchEvent(new w.Event('change',{bubbles:true}));
 await new Promise(resolve=>setTimeout(resolve,50));
 test('JSON import merges and serializes structured values',s.getItem(keys[2])==='{"enabled":true}');
 d.querySelector('#exportBtn').click();test('JSON export action reports success',d.querySelector('#ioStatus').textContent.includes('export'));
 d.querySelector('#resetBtn').click();d.querySelector('#key').value='__si_added';d.querySelector('#value').value='created';d.querySelector('#editor').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
 test('add creates a new entry',s.getItem('__si_added')==='created');
 const badFile=new w.File(['[]'],'invalid.json',{type:'application/json'}),badTransfer=new w.DataTransfer();badTransfer.items.add(badFile);d.querySelector('#file').files=badTransfer.files;d.querySelector('#file').dispatchEvent(new w.Event('change',{bubbles:true}));
 await new Promise(resolve=>setTimeout(resolve,25));test('invalid JSON shape is rejected',d.querySelector('#ioStatus').textContent.includes('object'));
 d.querySelector('#clearBtn').click();d.querySelector('#cancelClear').click();test('cancel preserves storage',s.getItem('__si_added')==='created'&&!d.querySelector('#confirmModal').hasAttribute('open'));
 d.querySelector('#clearBtn').click();d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));test('Escape dismisses clear dialog',!d.querySelector('#confirmModal').hasAttribute('open'));
 d.querySelector('#sessionTab').click();w.sessionStorage.setItem('__si_session','session value');d.querySelector('#search').value='__si_session';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));
 test('sessionStorage switches independently',d.querySelectorAll('.entry').length===1&&w.sessionStorage.getItem('__si_session')==='session value');
 d.querySelector('#clearBtn').click();test('clear opens confirmation',d.querySelector('#confirmModal').hasAttribute('open'));
 d.querySelector('#confirmClear').click();test('confirmed clear empties selected area',w.sessionStorage.length===0);
 }catch(e){test('test harness completed',false,e.message)}
 finally{clean();d.querySelector('#search').value='';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}))}
 const passed=results.filter(Boolean).length,total=results.length;document.querySelector('#summary').textContent=passed===total?'All '+total+' browser checks passed.':'Passed '+passed+' of '+total+' browser checks.';
 document.querySelector('#summary').style.color=passed===total?'#79e0b5':'#ff8793';
})();
</script></body></html>
