<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Storage Inspector smoke tests</title>
<style>body{font:16px system-ui;max-width:800px;margin:32px auto;padding:0 16px;background:#101827;color:#eef}li{padding:6px}.pass{color:#79e0b5}.fail{color:#ff8793}iframe{width:100%;height:560px;border:1px solid #445;border-radius:12px;margin-top:16px}</style>
<h1>Storage Inspector — browser smoke tests</h1><p>Runs against the app in a same-origin frame. Tests actual storage and UI interactions.</p><ol id="results"></ol><iframe id="app" src="index.html" title="Storage Inspector test instance"></iframe>
<script>
(async()=>{
 const out=document.querySelector('#results'),frame=document.querySelector('#app');
 const test=(name,ok,detail='')=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+name+(detail?' ('+detail+')':'');out.append(li)};
 await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
 const w=frame.contentWindow,d=frame.contentDocument,s=w.localStorage;
 const clean=()=>{s.removeItem('__si_test_a');s.removeItem('__si_test_b');w.sessionStorage.clear()};
 clean();s.setItem('__si_test_a','needle value');s.setItem('__si_test_b','other');
 d.querySelector('#search').value='needle';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));
 test('search filters keys/values',d.querySelectorAll('.entry').length===1&&d.querySelector('.key').textContent==='__si_test_a');
 d.querySelector('#search').value='';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));
 d.querySelector('button[aria-label="Edit __si_test_a"]').click();d.querySelector('#value').value='updated';d.querySelector('#editor').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
 test('edit updates storage',s.getItem('__si_test_a')==='updated');
 d.querySelector('button[aria-label="Delete __si_test_b"]').click();test('delete removes key',!s.hasItem?.('__si_test_b')&&s.getItem('__si_test_b')===null);
 d.querySelector('#sessionTab').click();w.sessionStorage.setItem('__si_session','session value');d.querySelector('#search').value='__si_session';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));
 test('sessionStorage area switches independently',d.querySelectorAll('.entry').length===1&&w.sessionStorage.getItem('__si_session')==='session value');
 d.querySelector('#clearBtn').click();d.querySelector('#confirmClear').click();test('clear requires confirmation and clears selected area',w.sessionStorage.length===0);
 clean();
})();
</script></html>
